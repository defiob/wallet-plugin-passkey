name: Publish to npm

# Trigger: push of a tag like v0.1.1, v1.0.0, etc. Typical flow:
#   pnpm version patch       # bumps version, makes a commit + tag
#   git push --follow-tags   # pushes both to GitHub → this workflow fires
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `id-token: write` is required for npm provenance (signed
      # attestation that this package was built from this exact commit
      # in this exact GitHub repo). Free, public-visible, recommended.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # --no-git-checks: CI runs in a detached HEAD which pnpm rejects by default.
      # --provenance: ships the SLSA attestation with the tarball.
      - run: pnpm publish --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
